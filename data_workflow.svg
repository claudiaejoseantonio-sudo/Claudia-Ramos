<svg width="680" height="820" viewBox="0 0 680 820" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Data Stack — fluxo de trabalho</title>
<desc>Diagrama vertical mostrando o fluxo entre as disciplinas de dados: da coleta e SQL até Python, governança, qualidade, analytics e Power BI.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <style>
    text { font-family: 'Segoe UI', 'Inter', Arial, sans-serif; fill: #1a1a1a; }
    .label-sm { font-size: 12px; fill: #555; }
    .label-md { font-size: 13px; font-weight: 500; fill: #1a1a1a; }
    .label-section { font-size: 11px; fill: #888; }
    .box-gray   { fill: #f1efe8; stroke: #888780; }
    .box-coral  { fill: #faece7; stroke: #d85a30; }
    .box-purple { fill: #eeedfe; stroke: #7f77dd; }
    .box-teal   { fill: #e1f5ee; stroke: #1d9e75; }
    .box-blue   { fill: #e6f1fb; stroke: #378add; }
    .box-amber  { fill: #faeeda; stroke: #ba7517; }
    .box-green  { fill: #eaf3de; stroke: #639922; }
    .txt-gray   { fill: #444441; }
    .txt-coral  { fill: #712b13; }
    .txt-purple { fill: #3c3489; }
    .txt-teal   { fill: #085041; }
    .txt-blue   { fill: #0c447c; }
    .txt-amber  { fill: #633806; }
    .txt-green  { fill: #27500a; }
    .connector  { stroke: #aaa; stroke-width: 1; fill: none; }
    .dashed     { stroke: #bbb; stroke-width: 1; stroke-dasharray: 3 3; fill: none; }
  </style>
</defs>

<!-- Background -->
<rect x="30" y="30" width="620" height="760" rx="16" fill="#ffffff" stroke="#ddd" stroke-width="0.8"/>

<!-- Title -->
<text x="340" y="66" text-anchor="middle" class="label-md" font-size="15">Data Stack — fluxo de trabalho</text>

<!-- ① Ingestão -->
<text x="340" y="95" text-anchor="middle" class="label-section">① Ingestão</text>

<rect x="60" y="104" width="168" height="46" rx="8" class="box-gray" stroke-width="0.5"/>
<text x="144" y="123" text-anchor="middle" class="label-md txt-gray">🗄️ SQL</text>
<text x="144" y="140" text-anchor="middle" class="label-sm txt-gray">Bancos relacionais</text>

<rect x="256" y="104" width="168" height="46" rx="8" class="box-gray" stroke-width="0.5"/>
<text x="340" y="123" text-anchor="middle" class="label-md txt-gray">🐍 Python</text>
<text x="340" y="140" text-anchor="middle" class="label-sm txt-gray">Scripts &amp; APIs</text>

<rect x="452" y="104" width="168" height="46" rx="8" class="box-gray" stroke-width="0.5"/>
<text x="536" y="123" text-anchor="middle" class="label-md txt-gray">📁 Fontes externas</text>
<text x="536" y="140" text-anchor="middle" class="label-sm txt-gray">CSV, APIs, planilhas</text>

<line x1="144" y1="150" x2="144" y2="194" class="connector" marker-end="url(#arrow)"/>
<line x1="340" y1="150" x2="340" y2="194" class="connector" marker-end="url(#arrow)"/>
<line x1="536" y1="150" x2="536" y2="194" class="connector" marker-end="url(#arrow)"/>
<line x1="144" y1="196" x2="340" y2="196" class="dashed"/>
<line x1="536" y1="196" x2="340" y2="196" class="dashed"/>

<!-- ② Data Quality -->
<text x="340" y="214" text-anchor="middle" class="label-section">② Qualidade</text>

<rect x="160" y="222" width="360" height="52" rx="8" class="box-coral" stroke-width="0.5"/>
<text x="340" y="241" text-anchor="middle" class="label-md txt-coral">🔍 Data Quality</text>
<text x="340" y="259" text-anchor="middle" class="label-sm txt-coral">Validação, limpeza, testes e monitoramento</text>

<line x1="340" y1="274" x2="340" y2="308" class="connector" marker-end="url(#arrow)"/>

<!-- ③ Governança -->
<text x="340" y="324" text-anchor="middle" class="label-section">③ Governança</text>

<rect x="160" y="332" width="360" height="52" rx="8" class="box-purple" stroke-width="0.5"/>
<text x="340" y="351" text-anchor="middle" class="label-md txt-purple">📋 Governança de Dados</text>
<text x="340" y="369" text-anchor="middle" class="label-sm txt-purple">Catálogo, lineage, políticas e LGPD</text>

<line x1="340" y1="384" x2="340" y2="418" class="connector" marker-end="url(#arrow)"/>

<!-- ④ Processamento -->
<text x="340" y="432" text-anchor="middle" class="label-section">④ Processamento &amp; Modelagem</text>

<rect x="60" y="440" width="270" height="52" rx="8" class="box-teal" stroke-width="0.5"/>
<text x="195" y="459" text-anchor="middle" class="label-md txt-teal">🐍 Python + SQL</text>
<text x="195" y="477" text-anchor="middle" class="label-sm txt-teal">ETL, transformações, modelos</text>

<rect x="350" y="440" width="270" height="52" rx="8" class="box-blue" stroke-width="0.5"/>
<text x="485" y="459" text-anchor="middle" class="label-md txt-blue">📊 BI &amp; Analytics</text>
<text x="485" y="477" text-anchor="middle" class="label-sm txt-blue">KPIs, métricas, análises</text>

<line x1="195" y1="492" x2="195" y2="536" class="connector" marker-end="url(#arrow)"/>
<line x1="485" y1="492" x2="485" y2="536" class="connector" marker-end="url(#arrow)"/>
<line x1="195" y1="538" x2="340" y2="538" class="dashed"/>
<line x1="485" y1="538" x2="340" y2="538" class="dashed"/>

<!-- ⑤ Power BI -->
<text x="340" y="556" text-anchor="middle" class="label-section">⑤ Visualização</text>

<rect x="160" y="563" width="360" height="52" rx="8" class="box-amber" stroke-width="0.5"/>
<text x="340" y="582" text-anchor="middle" class="label-md txt-amber">📉 Power BI</text>
<text x="340" y="600" text-anchor="middle" class="label-sm txt-amber">Dashboards, relatórios e alertas</text>

<line x1="340" y1="615" x2="340" y2="649" class="connector" marker-end="url(#arrow)"/>

<!-- ⑥ Analytics -->
<text x="340" y="664" text-anchor="middle" class="label-section">⑥ Decisão</text>

<rect x="160" y="672" width="360" height="52" rx="8" class="box-green" stroke-width="0.5"/>
<text x="340" y="691" text-anchor="middle" class="label-md txt-green">📈 Data Analytics</text>
<text x="340" y="709" text-anchor="middle" class="label-sm txt-green">Insights acionáveis e storytelling</text>

<!-- Feedback loop -->
<path d="M520 720 Q640 720 640 400 Q640 96 536 96" class="dashed" marker-end="url(#arrow)"/>
<text transform="rotate(90,656,412)" x="656" y="416" text-anchor="middle" class="label-section">feedback loop</text>

<!-- Footer -->
<rect x="60" y="748" width="560" height="28" rx="6" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
<text x="340" y="767" text-anchor="middle" class="label-section">Ingestão → Qualidade → Governança → Processamento → Visualização → Decisão ↻</text>

</svg>
